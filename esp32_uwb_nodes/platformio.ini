[platformio]
default_envs = node1

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = https://github.com/Fhilb/DW3000_Arduino.git

[env:node1]
build_flags =
  -DNODE_ID=1
  -DINITIATOR_NODE_ID=4
  -DNUM_NODES=4
  -DSINGLE_PAIR_DEBUG_MODE=0
  -DUWB_WIFI_TELEMETRY=1

[env:node2]
build_flags =
  -DNODE_ID=2
  -DINITIATOR_NODE_ID=4
  -DNUM_NODES=4
  -DSINGLE_PAIR_DEBUG_MODE=0
  -DUWB_WIFI_TELEMETRY=1

[env:node3]
build_flags =
  -DNODE_ID=3
  -DINITIATOR_NODE_ID=4
  -DNUM_NODES=4
  -DSINGLE_PAIR_DEBUG_MODE=0
  -DUWB_WIFI_TELEMETRY=1

[env:node4]
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit MPU6050 @ ^2.2.6
  adafruit/Adafruit Unified Sensor @ ^1.1.15
  adafruit/Adafruit BusIO @ ^1.17.2
build_flags =
  -DNODE_ID=4
  -DINITIATOR_NODE_ID=4
  -DNUM_NODES=4
  -DSINGLE_PAIR_DEBUG_MODE=0
  -DUWB_WIFI_TELEMETRY=1
  -DUWB_IMU_TELEMETRY=1
  -DUWB_LORA_TELEMETRY=1
